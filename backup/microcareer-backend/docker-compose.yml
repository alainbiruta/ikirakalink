
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:postgresql://postgres:illest@127.0.0.1:5432/microcareer
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: illest
      POSTGRES_DB: microcareer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: